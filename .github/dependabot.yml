# Dependabot opens one grouped pull request per ecosystem every Monday morning,
# with major updates kept apart from minor and patch updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
