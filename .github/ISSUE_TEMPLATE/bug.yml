name: Bug
description: closedbox does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got. Remove any secret first.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `closedbox --version`, `node --version` and `docker version --format '{{.Server.Version}}'`.
    validations:
      required: true
